name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# Every gate below is an independent job. They deliberately do not use `needs:`
# on one another: a gate that cannot fail on its own is not a gate. A single
# sequential job is what concealed a broken toolchain, dead code, 48 lint
# errors and 15 advisories for the life of this repository — see progress.md,
# "Retrospective", FLAG-04.
jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.18.4
      GITLEAKS_ARCH: linux_x64
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          cd "$workdir"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_${GITLEAKS_ARCH}.tar.gz"
          curl -sSfL -O "${base}/${tarball}"
          curl -sSfL -O "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan full history for secrets
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose

  preflight:
    name: Preflight (lockfile · toolchain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` fails outright when package.json and package-lock.json have
      # drifted, so this doubles as the lockfile-integrity check.
      - name: Install dependencies
        run: npm ci

      # The fault that started all of this: eslint was declared only as a peer
      # of its plugins, was never installed, and `npm run lint` exited 127 —
      # a missing binary that read like a code failure. This step turns that
      # class of fault into an immediate, unambiguous error. FLAG-05.
      - name: Verify declared toolchain present
        run: |
          npx --no-install ng version
          npx --no-install eslint --version
          npx --no-install tsc --version
          npx --no-install jest --version
          npx --no-install prettier --version

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Test (coverage floors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Test with coverage
        run: npm run test:ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build:
    name: Production build (bundle budgets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:prod

  supply-chain:
    name: Supply chain (audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Security audit
        run: npm audit --audit-level=high
